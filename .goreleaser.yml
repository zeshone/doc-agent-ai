version: 2

builds:
  - id: doc-agent-ai
    main: ./cmd/doc-agent-ai
    binary: doc-agent-ai
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    ldflags: '-s -w -X github.com/zeshone/doc-agent-ai/internal/build.Version={{.Version}}'

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "doc-agent-ai_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

brews:
  - name: doc-agent-ai
    homepage: "https://github.com/zeshone/doc-agent-ai"
    description: "Multi-platform documentation workflow agent installer"
    license: "MIT"
    directory: Formula
    repository:
      owner: zeshone
      name: homebrew-tap
      branch: main
      token: "{{ .Env.RELEASE_TOKEN }}"
    test: |
      system "#{bin}/doc-agent-ai --version"
    install: |
      bin.install "doc-agent-ai"

nfpms:
  - formats: [deb, rpm]
    maintainer: "Zesh-One"
    description: "Multi-platform documentation workflow agent installer"
    license: "MIT"

scoops:
  - name: doc-agent-ai
    homepage: "https://github.com/zeshone/doc-agent-ai"
    description: "Multi-platform documentation workflow agent installer"
    license: MIT
    directory: bucket
    repository:
      owner: zeshone
      name: scoop-bucket
      branch: main
      token: "{{ .Env.RELEASE_TOKEN }}"

release:
  github:
    owner: zeshone
    name: doc-agent-ai
  prerelease: auto
