name: CI

on:
  # No branch filter here on purpose. The filter matches the pull request's
  # TARGET branch, so `branches: [main]` skipped every chained pull request —
  # a stacked slice targets its parent branch, not main, and landed unchecked.
  pull_request:
  # Pushes stay limited to main: a push to a feature branch is already covered
  # by its pull request event, and filtering here avoids double runs.
  push:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Run tests
        run: go test ./... -v

  fmt-gate:
    name: gofmt gate
    runs-on: ubuntu-latest
    # No `needs: test` on purpose: formatting is independent of behaviour, so it
    # runs in parallel and reports the cheapest failure first.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Check gofmt
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$UNFORMATTED"
            echo "Fix with: gofmt -w ."
            exit 1
          fi
          echo "gofmt gate passed — every Go file is formatted."

  binary-size:
    name: Binary size gate (< 6 MB)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Build release binary
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o doc-agent-ai ./cmd/doc-agent-ai
      - name: Check binary size
        run: |
          LIMIT=6291456
          SIZE=$(stat -c%s doc-agent-ai 2>/dev/null || stat -f%z doc-agent-ai 2>/dev/null || wc -c < doc-agent-ai)
          echo "Binary size: $SIZE bytes (limit: $LIMIT bytes)"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::Binary size $SIZE bytes exceeds $LIMIT byte limit"
            exit 1
          fi

  lang-gate:
    name: English-only content gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Scan embedded content for non-English fragments
        run: |
          set +e
          # Line-scoped exemption: a matched line is allowed only when that
          # SAME line also carries "lang-gate-allow" inside a
          # "<!-- lang-gate-allow: <reason> -->" comment — e.g. a Spanish
          # phrase the agent must recognize in a user's own input, or a
          # worked example that teaches it to answer in the user's language.
          # This mirrors TestEmbeddedContent_EnglishOnly in
          # content_validation_test.go exactly (same PATTERNS, same marker
          # literal) so the shell gate and the Go test cannot disagree.
          # A file-wide ALLOWLIST used to sit here instead; it exempted an
          # entire file to protect one legitimate line, and silently hid a
          # real hardcoded-Spanish bug on another line of that same file.
          PATTERNS='[¿¡ñÑ]|\b(como|donde|porque|cuando|para|sobre|entonces|aunque|tambien|ademas|sino)\b|[\x{4E00}-\x{9FFF}\x{0600}-\x{06FF}\x{0400}-\x{04FF}]'
          MATCHES=$(grep -rPIn --include='*.md' --include='*.tmpl' --include='*.json' "$PATTERNS" src/ skills/)
          GREP_STATUS=$?
          # grep exits 1 when it simply finds no matches — that is success,
          # not an error. Any other non-zero exit (2, for example, for a
          # bad or conflicting pattern — exactly how this gate broke before:
          # `-P` and `-E` together made grep abort, and the failure was
          # swallowed) is a real failure and must not be treated as "clean".
          if [ "$GREP_STATUS" -gt 1 ]; then
            echo "::error::grep failed while scanning for non-English content (exit $GREP_STATUS) — the language gate could not run"
            exit 1
          fi
          VIOLATIONS=$(printf '%s\n' "$MATCHES" | grep -v 'lang-gate-allow')
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Non-English content detected in embedded files:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "Language gate passed — embedded content is English-only."
